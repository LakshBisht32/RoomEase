# No `databases:` block here on purpose — Render's free plan allows only one
# free Postgres instance per account. This blueprint instead reuses whatever
# free Postgres instance an existing project already created, and points
# DB_NAME at a new, separate database ("roomease") inside that same instance.
# db/migrate.js already creates that database automatically on first deploy
# if it doesn't exist yet, so no manual `CREATE DATABASE` step is needed.
services:
  # Express API
  - type: web
    name: roomease-api
    runtime: node
    plan: free
    buildCommand: npm install
    # Migrations are safe to re-run (schema_migrations tracks what already applied),
    # so running them before every start keeps the DB in sync with each deploy.
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Must match the client service's actual URL below (see notes in README/chat).
      - key: CLIENT_ORIGIN
        value: https://roomease-client.onrender.com
      # Fill these in during "New Blueprint" from your EXISTING Postgres
      # instance's Info page (use the Internal Hostname if both services are
      # in the same Render region — faster, and doesn't count against
      # egress bandwidth).
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: 5432
      # A separate database inside the shared instance — not the other
      # project's database name.
      - key: DB_NAME
        value: roomease

  # React (Vite) static site
  - type: web
    name: roomease-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time — must match the API service's
      # actual URL above.
      - key: VITE_API_URL
        value: https://roomease-api.onrender.com/api/v1
    routes:
      # Client-side routing (React Router) — unknown paths must still serve
      # index.html instead of a static 404.
      - type: rewrite
        source: /*
        destination: /index.html
